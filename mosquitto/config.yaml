---
version: 7.1.3-mid
slug: mosquitto_flags
name: Mosquitto broker (flags fix)
description: An Open Source MQTT broker with CONNECT-fields leniency for Polaris devices
url: https://github.com/Gerkbers/app-mosquitto
arch:
  - amd64
auth_api: true
discovery:
  - mqtt
map:
  - ssl
  - share
options:
  logins: []
  log_dest: []
  log_type: []
  require_certificate: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  customize:
    active: false
    folder: mosquitto
ports:
  1883/tcp: null
  1884/tcp: null
  8883/tcp: 8883
  8884/tcp: null
schema:
  logins:
    - username: str
      password: password
      password_pre_hashed: "bool?"
  log_dest:
    - list(none|stdout|stderr|topic)?
  log_type:
    - list(none|debug|error|warning|notice|information|subscribe|unsubscribe|websockets|all)?
  require_certificate: bool
  certfile: str
  cafile: str?
  keyfile: str
  customize:
    active: bool
    folder: str
  debug: bool?
services:
  - mqtt:provide
startup: system
init: false
